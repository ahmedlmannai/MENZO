<!doctype html><html lang="fr"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/><meta name="theme-color" content="#0b0b0b"/>
<title>MENZO</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600&family=Cairo:wght@400;600&display=swap" rel="stylesheet"/>
<style>:root{--bg:#0b0b0b;--card:#161616;--gold:#c9a24b;--tx:#f2ede3;--mut:#9a948a;--line:#2a2a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,Cairo,sans-serif}
[dir=rtl] body{font-family:Cairo,Inter,sans-serif}
h1,h2,.logo{font-family:'Cormorant Garamond',serif;color:var(--gold);letter-spacing:.12em}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-size:26px}main{max-width:900px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
button{cursor:pointer;transition:.2s}button:hover{border-color:var(--gold)}
button.gold,button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.slots{display:flex;flex-wrap:wrap;gap:8px}.err{color:#ff8a80}.ok{color:var(--gold)}.mut{color:var(--mut);font-size:14px}
form{display:grid;gap:10px;max-width:380px;margin:30px auto}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row input{width:100px}.row input.w{width:160px}img.sv{width:100%;height:120px;object-fit:cover;border-radius:10px}
</style></head><body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="text/babel">
const SUPABASE_URL="https://oygukjednmwteburqsdw.supabase.co"
const SUPABASE_KEY="sb_publishable_PJHEkOW40u9hpe283AFmPw_ZQXauBPI"
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)
const {useEffect,useState}=React
const LANGS=['fr','ar','en']
const R={
login:['Connexion','تسجيل الدخول','Log in'],signup:['Créer un compte','إنشاء حساب','Sign up'],
logout:['Déconnexion','خروج','Log out'],email:['E-mail','البريد الإلكتروني','Email'],
password:['Mot de passe','كلمة السر','Password'],name:['Nom complet','الاسم الكامل','Full name'],
phone:['Téléphone','الهاتف','Phone'],forgot:['Mot de passe oublié ?','نسيت كلمة السر؟','Forgot password?'],
checkmail:['Vérifiez votre e-mail.','تفقد بريدك الإلكتروني.','Check your email.'],
book:['Réserver','احجز','Book'],mine:['Mes rendez-vous','مواعيدي','My appointments'],
admin:['Administration','الإدارة','Admin'],appts:['Rendez-vous','المواعيد','Appointments'],
services:['Services','الخدمات','Services'],price:['Prix (TND)','السعر (دينار)','Price (TND)'],
min:['min','دقيقة','min'],date:['Date','التاريخ','Date'],none:['Aucun créneau disponible','لا توجد أوقات متاحة','No slots available'],
choose:['Choisissez un service','اختر خدمة','Choose a service'],
booked:['Réservation enregistrée ✓ Réf.','تم الحجز ✓ المرجع','Booked ✓ Ref.'],
cancel:['Annuler','إلغاء','Cancel'],spent:['Total dépensé','مجموع المصاريف','Total spent'],
save:['Enregistrer','حفظ','Save'],delete:['Supprimer','حذف','Delete'],add:['Ajouter un service','إضافة خدمة','Add service'],
active:['Actif','مفعّل','Active'],blocked:['Compte bloqué. Contactez le salon.','الحساب موقوف. اتصل بالصالون.','Account blocked. Contact the shop.'],
slot_unavailable:['Ce créneau vient d\'être pris. Choisissez-en un autre.','هذا الوقت تم حجزه. اختر وقتًا آخر.','That slot was just taken. Pick another.'],
cancellation_window_closed:['Délai d\'annulation dépassé.','انتهى أجل الإلغاء.','Cancellation window closed.'],
pending:['En attente','في الانتظار','Pending'],confirmed:['Confirmé','مؤكد','Confirmed'],
completed:['Terminé','منتهي','Completed'],cancelled:['Annulé','ملغى','Cancelled'],no_show:['Absent','لم يحضر','No-show'],
all:['Tous','الكل','All'],welcome:['L\'élégance, à votre rythme.','الأناقة على طريقتك.','Elegance, your way.']}

const fmt=(d,o)=>new Date(d).toLocaleString('fr-FR',{timeZone:'Africa/Tunis',...o})
const today=()=>new Date().toISOString().slice(0,10)
const ST=['pending','confirmed','completed','cancelled','no_show']

function App(){
  const [lang,setLang]=useState(localStorage.getItem('lang')||'fr')
  const [session,setSession]=useState(null),[ready,setReady]=useState(false),[me,setMe]=useState(null),[view,setView]=useState('book')
  const t=k=>(R[k]||[k,k,k])[LANGS.indexOf(lang)]
  useEffect(()=>{document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';localStorage.setItem('lang',lang)},[lang])
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>{setSession(data.session);setReady(true)})
    const {data:l}=sb.auth.onAuthStateChange((_,s)=>setSession(s))
    return()=>l.subscription.unsubscribe()
  },[])
  useEffect(()=>{
    if(!session){setMe(null);return}
    sb.from('profiles').select('*').eq('id',session.user.id).single().then(({data})=>setMe(data))
  },[session])
  if(!ready)return null
  return <>
    <header>
      <span className="logo">MENZO</span>
      {me&&!me.is_blocked&&<nav>
        <button className={view==='book'?'on':''} onClick={()=>setView('book')}>{t('book')}</button>
        <button className={view==='mine'?'on':''} onClick={()=>setView('mine')}>{t('mine')}</button>
        {me.role==='admin'&&<button className={view==='admin'?'on':''} onClick={()=>setView('admin')}>{t('admin')}</button>}
      </nav>}
      <span className="row">
        <select value={lang} onChange={e=>setLang(e.target.value)}>{LANGS.map(l=><option key={l}>{l}</option>)}</select>
        {session&&<button onClick={()=>sb.auth.signOut()}>{t('logout')}</button>}
      </span>
    </header>
    <main>
      {!session?<Auth t={t}/>:!me?null:me.is_blocked?<p className="err">{t('blocked')}</p>:
        view==='book'?<Book t={t}/>:view==='mine'?<Mine t={t}/>:me.role==='admin'?<Admin t={t}/>:null}
    </main>
  </>
}

function Auth({t}){
  const [m,setM]=useState('in'),[f,setF]=useState({}),[msg,setMsg]=useState('')
  const s=k=>e=>setF({...f,[k]:e.target.value})
  async function go(e){
    e.preventDefault();setMsg('')
    let r
    if(m==='in')r=await sb.auth.signInWithPassword({email:f.email,password:f.password})
    else if(m==='up')r=await sb.auth.signUp({email:f.email,password:f.password,options:{data:{full_name:f.name,phone:f.phone}}})
    else r=await sb.auth.resetPasswordForEmail(f.email,{redirectTo:location.origin+location.pathname})
    if(r.error)setMsg(r.error.message);else if(m!=='in')setMsg(t('checkmail'))
  }
  return <form onSubmit={go}>
    <h1>{t('welcome')}</h1>
    {m==='up'&&<><input required placeholder={t('name')} onChange={s('name')}/><input required placeholder={t('phone')} onChange={s('phone')}/></>}
    <input required type="email" placeholder={t('email')} onChange={s('email')}/>
    {m!=='forgot'&&<input required minLength={8} type="password" placeholder={t('password')} onChange={s('password')}/>}
    <button className="gold">{m==='in'?t('login'):m==='up'?t('signup'):t('forgot')}</button>
    {msg&&<span className="mut">{msg}</span>}
    <span className="row">
      <button type="button" onClick={()=>setM(m==='in'?'up':'in')}>{m==='in'?t('signup'):t('login')}</button>
      <button type="button" onClick={()=>setM('forgot')}>{t('forgot')}</button>
    </span>
  </form>
}

function Book({t}){
  const [svcs,setSvcs]=useState([]),[svc,setSvc]=useState(null),[barber,setBarber]=useState(null)
  const [date,setDate]=useState(''),[slots,setSlots]=useState([]),[ok,setOk]=useState(null),[err,setErr]=useState(''),[tick,setTick]=useState(0)
  useEffect(()=>{
    sb.from('services').select('*').eq('is_active',true).order('sort_order').then(r=>setSvcs(r.data||[]))
    sb.from('barbers').select('id').eq('is_active',true).limit(1).then(r=>setBarber(r.data?.[0]?.id))
  },[])
  useEffect(()=>{
    setSlots([])
    if(svc&&date&&barber)sb.rpc('get_available_slots',{p_barber:barber,p_service:svc.id,p_date:date}).then(r=>setSlots((r.data||[]).map(x=>x.slot_start)))
  },[svc,date,barber,tick])
  async function book(s){
    setErr('')
    const r=await sb.rpc('book_appointment',{p_service:svc.id,p_barber:barber,p_start:s})
    if(r.error){setErr(t(r.error.message.trim())||r.error.message);setTick(x=>x+1)}else setOk(r.data)
  }
  if(ok)return <div className="card"><h2 className="ok">{t('booked')} {ok.reference}</h2>
    <p>{ok.service_name} — {fmt(ok.starts_at,{dateStyle:'full',timeStyle:'short'})}</p>
    <p>{ok.total_tnd} TND</p><button onClick={()=>{setOk(null);setSvc(null);setDate('')}}>OK</button></div>
  return <>
    <h2>{t('choose')}</h2>
    <div className="grid">{svcs.map(s=><div key={s.id} className="card" style={svc?.id===s.id?{borderColor:'var(--gold)'}:{}}>
      {s.image_url&&<img className="sv" src={s.image_url} alt=""/>}
      <b>{s.name}</b><p className="mut">{s.description}</p>
      <p>{s.price_tnd} TND · {s.duration_min} {t('min')}</p>
      <button className={svc?.id===s.id?'on':''} onClick={()=>setSvc(s)}>{t('book')}</button></div>)}</div>
    {svc&&<div className="card"><h2>{svc.name}</h2>
      <input type="date" min={today()} value={date} onChange={e=>setDate(e.target.value)}/>
      {date&&<div className="slots" style={{marginTop:12}}>
        {slots.length?slots.map(s=><button key={s} onClick={()=>book(s)}>{fmt(s,{hour:'2-digit',minute:'2-digit'})}</button>):<span className="mut">{t('none')}</span>}</div>}
      {err&&<p className="err">{err}</p>}</div>}
  </>
}

function Mine({t}){
  const [rows,setRows]=useState([]),[err,setErr]=useState('')
  const load=()=>sb.from('appointments').select('*').order('starts_at',{ascending:false}).then(r=>setRows(r.data||[]))
  useEffect(()=>{load()},[])
  async function cancel(id){
    const r=await sb.rpc('cancel_my_appointment',{p_id:id})
    setErr(r.error?(t(r.error.message.trim())||r.error.message):'');load()
  }
  const spent=rows.filter(a=>a.status==='completed').reduce((s,a)=>s+Number(a.total_tnd),0)
  return <>
    <h2>{t('mine')}</h2><p className="mut">{t('spent')}: {spent.toFixed(3)} TND</p>{err&&<p className="err">{err}</p>}
    {rows.map(a=><div className="card" key={a.id}>
      <b>{a.service_name}</b> <span className="mut">#{a.reference}</span>
      <p>{fmt(a.starts_at,{dateStyle:'medium',timeStyle:'short'})} · {a.total_tnd} TND · <span className="ok">{t(a.status)}</span></p>
      {['pending','confirmed'].includes(a.status)&&new Date(a.starts_at)>new Date()&&<button onClick={()=>cancel(a.id)}>{t('cancel')}</button>}
    </div>)}
  </>
}

function Admin({t}){
  const [tab,setTab]=useState('appts')
  return <>
    <nav><button className={tab==='appts'?'on':''} onClick={()=>setTab('appts')}>{t('appts')}</button>
    <button className={tab==='svc'?'on':''} onClick={()=>setTab('svc')}>{t('services')}</button></nav>
    {tab==='appts'?<AdminAppts t={t}/>:<AdminServices t={t}/>}
  </>
}

function AdminAppts({t}){
  const [rows,setRows]=useState([]),[f,setF]=useState('all'),[q,setQ]=useState('')
  const load=()=>sb.from('appointments').select('*').order('starts_at',{ascending:false}).then(r=>setRows(r.data||[]))
  useEffect(()=>{load()},[])
  const set=async(id,status)=>{await sb.from('appointments').update({status}).eq('id',id);load()}
  const list=rows.filter(a=>(f==='all'||a.status===f)&&(a.client_name+a.client_phone).toLowerCase().includes(q.toLowerCase()))
  return <>
    <div className="row" style={{margin:'12px 0'}}>
      <select value={f} onChange={e=>setF(e.target.value)}><option value="all">{t('all')}</option>{ST.map(s=><option key={s} value={s}>{t(s)}</option>)}</select>
      <input className="w" placeholder={`${t('name')} / ${t('phone')}`} onChange={e=>setQ(e.target.value)}/></div>
    {list.map(a=><div className="card" key={a.id}>
      <b>{a.client_name}</b> · {a.client_phone} <span className="mut">#{a.reference}</span>
      <p>{a.service_name} — {fmt(a.starts_at,{dateStyle:'medium',timeStyle:'short'})} · {a.total_tnd} TND · <span className="ok">{t(a.status)}</span></p>
      <div className="row">{ST.filter(s=>s!==a.status).map(s=><button key={s} onClick={()=>set(a.id,s)}>{t(s)}</button>)}</div>
    </div>)}
  </>
}

function AdminServices({t}){
  const [rows,setRows]=useState([])
  const load=()=>sb.from('services').select('*').order('sort_order').then(r=>setRows(r.data||[]))
  useEffect(()=>{load()},[])
  const edit=(id,k,v)=>setRows(rows.map(r=>r.id===id?{...r,[k]:v}:r))
  const save=async r=>{await sb.from('services').update({name:r.name,description:r.description,image_url:r.image_url,price_tnd:r.price_tnd,duration_min:r.duration_min,is_active:r.is_active}).eq('id',r.id);load()}
  const del=async id=>{if(confirm('?')){await sb.from('services').delete().eq('id',id);load()}}
  const add=async()=>{await sb.from('services').insert({name:'Nouveau',price_tnd:0,duration_min:30,is_active:false,sort_order:rows.length+1});load()}
  const upload=async(r,file)=>{
    if(!file)return
    const path=`${r.id}-${Date.now()}`
    const u=await sb.storage.from('service-images').upload(path,file)
    if(!u.error)edit(r.id,'image_url',sb.storage.from('service-images').getPublicUrl(path).data.publicUrl)
  }
  return <>
    <button className="gold" style={{margin:'12px 0'}} onClick={add}>+ {t('add')}</button>
    {rows.map(r=><div className="card" key={r.id}>
      {r.image_url&&<img className="sv" src={r.image_url} alt=""/>}
      <div className="row"><input className="w" value={r.name} onChange={e=>edit(r.id,'name',e.target.value)}/>
      <input type="number" step="0.001" min="0" value={r.price_tnd} onChange={e=>edit(r.id,'price_tnd',e.target.value)}/>
      <input type="number" min="5" value={r.duration_min} onChange={e=>edit(r.id,'duration_min',e.target.value)}/>
      <label><input type="checkbox" style={{width:'auto'}} checked={r.is_active} onChange={e=>edit(r.id,'is_active',e.target.checked)}/> {t('active')}</label></div>
      <input style={{width:'100%',margin:'8px 0'}} value={r.description||''} placeholder="Description" onChange={e=>edit(r.id,'description',e.target.value)}/>
      <input type="file" accept="image/*" onChange={e=>upload(r,e.target.files[0])}/>
      <div className="row" style={{marginTop:8}}><button className="gold" onClick={()=>save(r)}>{t('save')}</button><button onClick={()=>del(r.id)}>{t('delete')}</button></div>
    </div>)}
  </>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script></body></html>
